<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentur-Assistent</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 0 auto; padding: 16px; }
    #log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .msg { padding: 8px 12px; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #dbeafe; align-self: flex-end; }
    .bot { background: #f3f4f6; align-self: flex-start; }
    .error { background: #fee2e2; align-self: flex-start; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" required placeholder="Nachricht ...">
    <button id="send">Senden</button>
  </form>

  <script>
    const USER_ID = "florian";
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // textContent statt innerHTML: LLM-Antworten werden nie als HTML interpretiert (kein XSS)
    function addMessage(who, text) {
      const el = document.createElement("div");
      el.className = `msg ${who}`;
      el.textContent = text;
      log.appendChild(el);
      el.scrollIntoView();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addMessage("user", message);
      input.value = "";
      send.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: USER_ID, message }),
        });
        const data = await res.json();
        // fetch wirft bei 4xx/5xx nicht, deshalb res.ok selbst prüfen
        if (res.ok) addMessage("bot", data.reply);
        else addMessage("error", data.error ?? `Fehler ${res.status}`);
      } catch {
        addMessage("error", "Server nicht erreichbar");
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
